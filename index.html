<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AP Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin: 10px 0; }
    input { padding: 10px; font-size: 16px; width: 240px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; max-width: 520px; }
    button { padding: 14px 10px; font-size: 16px; }
    #status { margin: 12px 0; }
    select { padding: 10px; font-size: 16px; }
    .keyboard {
      position: relative;
      width: min(100%, 560px);   /* 画面幅に合わせて縮む */
      height: 180px;
      margin-top: 16px;
      user-select: none;
    }

    /* 白鍵：7本。割合で幅を決める */
    .key.white {
      position: absolute;
      bottom: 0;
      width: calc(100% / 7);
      height: 180px;
      background: white;
      border: 1px solid #333;
      box-sizing: border-box;
      border-radius: 0 0 6px 6px;
      padding: 0;
      cursor: pointer;
    }

    /* 白鍵ラベル：下 */
    .key.white .label {
      position: absolute;
      left: 0; right: 0;
      bottom: 8px;
      text-align: center;
      font-size: 14px;
      color: #111;
    }

    /* 黒鍵：白鍵幅のだいたい60% */
    .key.black {
      position: absolute;
      top: 0;
      width: calc((100% / 7) * 0.62);
      height: 110px;
      background: #111;
      color: white;
      z-index: 2;
      border: 1px solid #000;
      border-radius: 0 0 6px 6px;
      padding: 0;
      cursor: pointer;
    }

    /* 黒鍵ラベル：中央 */
    .key.black .label {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-size: 13px;
      color: #fff;
    }

    /* 押下ハイライト（JSで付け外し） */
    .key.pressed.white { background: #d9e8ff; }
    .key.pressed.black { background: #3a3a3a; }

    /* 触ったときに選択が出ないように */
    .key { -webkit-tap-highlight-color: transparent; }
    
    /* ===== クリック/フォーカスでレイアウトがズレないように固定 ===== */
    #keyboard .key{
      box-sizing: border-box;
      outline: none;              /* フォーカス輪郭でズレるのを防ぐ */
      border-width: 1px;          /* 押しても太さが変わらないよう固定 */
      padding: 0;                 /* 既に0だが念のため */
      line-height: 1;             /* フォント差で高さが揺れないように */
      -webkit-appearance: none; appearance: none;
    }

    #keyboard .key:focus,
    #keyboard .key:focus-visible,
    #keyboard .key:active{
      outline: none;
      box-shadow: none;           /* 影で見た目が動くのを防ぐ */
      transform: none;            /* 押下時の微妙な移動を無効化 */
    }

    #keyboard { overflow: hidden; } /* 1pxズレでスクロールバーが出るのを防ぐ */
    
    #rowSave {max-width: 560px; }          /* keyboardのmaxに合わせる */  
    #rowSave button {flex: 1 1 220px; }   /* モバイルで2つが落ちにくいように */
    </style>
</head>
<body>
  <h1>Absolute Pitch Test</h1>

  <div class="row">
    <label for="ID"><b>ID / Name</b></label>
    <input id="ID" type="text" placeholder="EX: S01 / Michael" />
  </div>
  <!-- ===== Demographics ===== -->
  <div class="row">
    <label for="sex"><b>Sex</b></label>
    <select id="sex">
      <option value="">Select...</option>
      <option value="F">F</option>
      <option value="M">M</option>
      <option value="Other">Other / Prefer not to say</option>
    </select>

    <label for="age"><b>Age</b></label>
    <input id="age" type="number" min="0" max="120" placeholder="e.g., 23" style="width:120px;" />
  </div>

  <!-- ===== Instruments (multiple rows) ===== -->
  <div class="row" style="align-items:flex-start;">
    <div>
      <div style="font-weight:700;margin-bottom:6px;">Instruments</div>
      <div class="row" id="instRows" style="margin:0;">
        <div class="row instRow" style="margin:0;">
          <select class="instName">
            <option value="">Select...</option>
            <option value="non-musician">non-musician</option>
            <option value="piano">piano</option>
            <option value="violin">violin</option>
            <option value="flute">flute</option>
            <option value="clarinet">clarinet</option>
            <option value="saxophone">saxophone</option>
            <option value="trumpet">trumpet</option>
            <option value="trombone">trombone</option>
            <option value="cello">cello</option>
            <option value="guitar">guitar</option>
            <option value="voice">voice</option>
            <option value="other">other</option>
          </select>

          <input class="instStart" type="number" min="0" max="120" placeholder="start age" style="width:120px;" />
          <input class="instEnd" type="number" min="0" max="120" placeholder="end age" style="width:120px;" />
          <input class="instOther" type="text" placeholder="if other, type name" style="width:180px; display:none;" />
        </div>
      </div>

      <div class="row" style="margin-top:8px;">
        <button type="button" id="btnAddInst" onclick="addInstrumentRow()">+ Add instrument</button>
      </div>
    </div>
  </div>

  <div class="row" id="rowStart">
    <button id="btnStart">Start</button>
    <button id="btnVolPlay" disabled>Volume Check Play</button>
    <button id="btnVolOK" disabled>Volume OK (Begin)</button>
  </div>

  <div id="status">Not yet started</div>

  <h2>Response</h2>
  <div id="keyboard" class="keyboard"></div><br>

  <div id="summary"></div>
  <canvas id="accChart" style="display:none; width:100%; height:220px;"></canvas>
  <canvas id="rtChart" style="display:none; width:100%; height:220px; margin-top:12px;"></canvas>

  <div class="row" id="rowSave">
  <button id="btnDownload" disabled>Download CSV</button>
  <button id="btnPdf" disabled>Save Result PDF</button>
</div>
  <script src="test.js" defer></script>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx4sW0fxcCBf8sJ3JdknykPN6ai4zh4LEDK78EC9E2lS5q5FE2l0R_W4zQhV-Jkoyir/exec";
    
    async function sendDataToGAS({ ID, test, payload }) {
      const body = {
        ID,
        test,
        payload,
        userAgent: navigator.userAgent,
        clientTimeISO: new Date().toISOString(),
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(body),
        });

      
        return res.ok;
      } catch (e) {
        return false;
      }
    }
  </script>
</body>
</html>
